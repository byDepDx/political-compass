<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Политический 2D Компас</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .quiz-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 650px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 32px;
      border: 1px solid var(--border-color);
    }

    /* Прогресс-бар */
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--primary-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Заголовок и вопрос */
    .chapter-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary-color);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 19px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 24px;
      color: var(--text-main);
      min-height: 56px;
    }

    /* Варианты ответов */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .option-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: var(--primary-color);
      background-color: #eff6ff;
      color: var(--primary-color);
    }

    /* Кнопки навигации (Назад) */
    .nav-controls {
      display: flex;
      justify-content: flex-start;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover:not(:disabled) {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      color: var(--text-main);
    }

    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--border-color);
    }

    /* Блок результатов */
    .results-box {
      text-align: center;
      display: none;
    }

    .results-box h2 {
      font-size: 22px;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .ideology-name {
      font-size: 28px;
      color: var(--primary-color);
      font-weight: 800;
      margin-bottom: 12px;
    }

    .coordinates-info {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 24px;
      font-weight: 500;
    }

    .restart-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .restart-btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <!-- ИНТЕРФЕЙС ТЕСТА -->
    <div id="quiz-ui">
      <div class="progress-header">
        <span id="chapter-label" class="chapter-title">Глава 1</span>
        <span id="progress-text">1 / 40</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>

      <div id="question-text" class="question-text">Загрузка вопроса...</div>

      <div class="options-grid">
        <button class="option-btn" onclick="selectOption(2)">Полностью согласен</button>
        <button class="option-btn" onclick="selectOption(1)">Скорее согласен</button>
        <button class="option-btn" onclick="selectOption(-1)">Скорее не согласен</button>
        <button class="option-btn" onclick="selectOption(-2)">Совершенно не согласен</button>
      </div>

      <div class="nav-controls">
        <button id="btn-back" class="btn-secondary" onclick="prevQuestion()" disabled>
          ← Назад
        </button>
      </div>
    </div>

    <!-- ИНТЕРФЕЙС РЕЗУЛЬТАТОВ -->
    <div id="results-ui" class="results-box">
      <h2>Ваша идеология:</h2>
      <div id="ideology-title" class="ideology-name">Загрузка...</div>
      <div id="coordinates-text" class="coordinates-info">X: 0, Y: 0</div>
      <button class="restart-btn" onclick="restartQuiz()">Пройти заново</button>
    </div>
  </div>

  <script>
    // ВСЕ 40 ВОПРОСОВ ПО ГЛАВАМ
    const questions = [
      // Глава 1: Внешняя политика и патриотизм
      { text: "Государственные интересы и суверенитет всегда важнее международных прав человека.", axis: 'Y', multiplier: -1, chapter: "Глава 1: Внешняя политика" },
      { text: "Граждане должны безусловно поддерживать свою страну в любых внешнеполитических конфликтах.", axis: 'Y', multiplier: -1, chapter: "Глава 1: Внешняя политика" },
      { text: "Патриотическое воспитание в школах должно быть обязательным с раннего детства.", axis: 'Y', multiplier: -1, chapter: "Глава 1: Внешняя политика" },
      { text: "Импортные товары, иностранные языки и чужие культурные веяния вредят идентичности нации.", axis: 'Y', multiplier: -1, chapter: "Глава 1: Внешняя политика" },
      { text: "Любая критическая публикация о действиях своей армии должна быть запрещена.", axis: 'Y', multiplier: -1, chapter: "Глава 1: Внешняя политика" },

      // Глава 2: Экономика
      { text: "Крупная промышленность, недра и энергетика должны полностью принадлежать государству.", axis: 'X', multiplier: -1, chapter: "Глава 2: Экономика" },
      { text: "Высокие налоги для богатых людей — единственный путь к справедливому обществу.", axis: 'X', multiplier: -1, chapter: "Глава 2: Экономика" },
      { text: "Государство не должно вмешиваться в ценообразование, даже на продукты первой необходимости.", axis: 'X', multiplier: 1, chapter: "Глава 2: Экономика" },
      { text: "Бесплатное здравоохранение и образование — это обязанность государства, а не услуга.", axis: 'X', multiplier: -1, chapter: "Глава 2: Экономика" },
      { text: "Профсоюзы и законы о труде только мешают развитию бизнеса и росту зарплат.", axis: 'X', multiplier: 1, chapter: "Глава 2: Экономика" },
      { text: "Каждый человек должен сам копить на свою пенсию, без участия государственного пенсионного фонда.", axis: 'X', multiplier: 1, chapter: "Глава 2: Экономика" },
      { text: "Государство должно выплачивать Базовый Безусловный Доход каждому гражданину.", axis: 'X', multiplier: -1, chapter: "Глава 2: Экономика" },
      { text: "Поддержка убыточных предприятий за счет бюджета — это ошибка, слабый бизнес должен закрываться.", axis: 'X', multiplier: 1, chapter: "Глава 2: Экономика" },
      { text: "Прогрессивная шкала налогообложения справедливее, чем плоская.", axis: 'X', multiplier: -1, chapter: "Глава 2: Экономика" },
      { text: "Частная собственность на землю и ресурсы должна быть абсолютно неприкосновенной.", axis: 'X', multiplier: 1, chapter: "Глава 2: Экономика" },

      // Глава 3: Личные социальные ценности
      { text: "Традиционная семья — это единственная правильная основа общества.", axis: 'Y', multiplier: -1, chapter: "Глава 3: Социальные ценности" },
      { text: "Религия и вера должны играть активную роль в государственном управлении и образовании.", axis: 'Y', multiplier: -1, chapter: "Глава 3: Социальные ценности" },
      { text: "Взрослые люди имеют право употреблять любые вещества или алкоголь, пока это не вредит другим.", axis: 'Y', multiplier: 1, chapter: "Глава 3: Социальные ценности" },
      { text: "Эвтаназия должна быть легализована.", axis: 'Y', multiplier: 1, chapter: "Глава 3: Социальные ценности" },
      { text: "Государство имеет право требовать от граждан отработки или обязательной службы.", axis: 'Y', multiplier: -1, chapter: "Глава 3: Социальные ценности" },
      { text: "Право на ношение оружия для самообороны должно быть доступно каждому дееспособному гражданину.", axis: 'Y', multiplier: 1, chapter: "Глава 3: Социальные ценности" },
      { text: "Свобода слова должна защищать даже те высказывания, которые кажутся большинству оскорбительными.", axis: 'Y', multiplier: 1, chapter: "Глава 3: Социальные ценности" },
      { text: "Аборты должны быть запрещены или строго ограничены законом.", axis: 'Y', multiplier: -1, chapter: "Глава 3: Социальные ценности" },
      { text: "Цензура в искусстве, кино и литературе необходима для защиты морали.", axis: 'Y', multiplier: -1, chapter: "Глава 3: Социальные ценности" },
      { text: "Граждане должны иметь право без ограничений выбирать место жительства и выезжать из страны.", axis: 'Y', multiplier: 1, chapter: "Глава 3: Социальные ценности" },

      // Глава 4: Видение общества в целом
      { text: "Иерархия и неравенство в обществе естественны — сильные и талантливые всегда должны быть вверху.", axis: 'X', multiplier: 1, chapter: "Глава 4: Общество" },
      { text: "Соблюдение порядка и стабильности в обществе важнее, чем отдельные права человека.", axis: 'Y', multiplier: -1, chapter: "Глава 4: Общество" },
      { text: "Прогресс человечества важнее сохранения национальных и религиозных традиций.", axis: 'Y', multiplier: 1, chapter: "Глава 4: Общество" },
      { text: "Технологии и автоматизация должны контролироваться государством.", axis: 'X', multiplier: -1, chapter: "Глава 4: Общество" },
      { text: "Преступников нужно жестко наказывать и изолировать, а не пытаться перевоспитать.", axis: 'Y', multiplier: -1, chapter: "Глава 4: Общество" },
      { text: "Социальная помощь развращает людей и делает их ленивыми.", axis: 'X', multiplier: 1, chapter: "Глава 4: Общество" },
      { text: "Безопасность на улицах и тотальное видеонаблюдение важнее приватности граждан.", axis: 'Y', multiplier: -1, chapter: "Глава 4: Общество" },
      { text: "Конкуренция — главный двигатель развития человечества во всех сферах.", axis: 'X', multiplier: 1, chapter: "Глава 4: Общество" },
      { text: "Государство должно жестко бороться с экологическими загрязнениями, даже если это вредит экономическому росту.", axis: 'X', multiplier: -1, chapter: "Глава 4: Общество" },
      { text: "Управление государством нужно доверить профессиональным экспертам и ученым, а не голосовать на референдумах.", axis: 'Y', multiplier: -1, chapter: "Глава 4: Общество" },

      // Глава 5: Вопросы о сексе и интимной жизни
      { text: "Интимная жизнь граждан — это их личное дело, государство вообще не должно туда лезть.", axis: 'Y', multiplier: 1, chapter: "Глава 5: Личная жизнь" },
      { text: "Порнография и взрослый контент должны быть полностью запрещены законом.", axis: 'Y', multiplier: -1, chapter: "Глава 5: Личная жизнь" },
      { text: "Сексуальное просвещение в школах необходимо для здоровья и безопасности подростков.", axis: 'Y', multiplier: 1, chapter: "Глава 5: Личная жизнь" },
      { text: "Добровольный секс за деньги должен быть легализован и облагаться налогом.", axis: 'Y', multiplier: 1, chapter: "Глава 5: Личная жизнь" },
      { text: "Публичная демонстрация и продвижение нетрадиционных сексуальных отношений недопустимы.", axis: 'Y', multiplier: -1, chapter: "Глава 5: Личная жизнь" }
    ];

    let currentQuestionIndex = 0;
    let userAnswers = []; // История ответов

    // Отрисовка текущего вопроса
    function renderQuestion() {
      const q = questions[currentQuestionIndex];
      
      document.getElementById('question-text').innerText = q.text;
      document.getElementById('chapter-label').innerText = q.chapter;
      
      const currentNum = currentQuestionIndex + 1;
      const totalNum = questions.length;
      document.getElementById('progress-text').innerText = `${currentNum} / ${totalNum}`;
      document.getElementById('progress-bar').style.width = `${(currentNum / totalNum) * 100}%`;

      // Управление состоянием кнопки "Назад"
      const backBtn = document.getElementById('btn-back');
      backBtn.disabled = (currentQuestionIndex === 0);
    }

    // Обработка выбора ответа
    function selectOption(score) {
      userAnswers.push(score);
      currentQuestionIndex++;

      if (currentQuestionIndex < questions.length) {
        renderQuestion();
      } else {
        calculateAndShowResults();
      }
    }

    // Функция кнопки "Назад"
    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        userAnswers.pop(); // Удаляем последний сохраненный ответ
        renderQuestion();
      }
    }

    // Функция определения названий идеологий (getScientificIdeology)
    function getScientificIdeology(x, y) {
      const dist = Math.sqrt(x * x + y * y);
      
      if (dist <= 2) return "Центризм / Прагматизм";

      // 1. Верхний правый: Свободный рынок + Личные свободы
      if (x >= 0 && y >= 0) {
        if (x >= 6 && y >= 6) return "Анархо-капитализм / Либертарианство";
        if (x >= 4) return "Классический либерализм";
        return "Неолиберализм";
      }

      // 2. Верхний левый: Госплан + Личные свободы
      if (x < 0 && y >= 0) {
        if (x <= -6 && y >= 6) return "Анархо-коммунизм / Левый анархизм";
        if (x <= -4) return "Демократический социализм";
        return "Социал-демократия";
      }

      // 3. Нижний правый: Свободный рынок + Госконтроль
      if (x >= 0 && y < 0) {
        if (x >= 6 && y <= -6) return "Правый авторитаризм";
        if (y <= -5) return "Авторитарный капитализм";
        return "Консерватизм";
      }

      // 4. Нижний левый: Госплан + Госконтроль
      if (x < 0 && y < 0) {
        if (x <= -8 || y <= -8) return "Тоталитарный коллективизм";
        if (x >= -4 && y >= -4) return "Авторитарный социализм";
        return "Государственный этатизм";
      }

      return "Неопределенная позиция";
    }

    // Расчет координат и вывод результата
    function calculateAndShowResults() {
      let rawX = 0, maxX = 0;
      let rawY = 0, maxY = 0;

      questions.forEach((q, index) => {
        const answer = userAnswers[index];
        if (q.axis === 'X') {
          rawX += answer * q.multiplier;
          maxX += 2;
        } else if (q.axis === 'Y') {
          rawY += answer * q.multiplier;
          maxY += 2;
        }
      });

      // Перевод в шкалу от -10 до +10
      const finalX = Math.round((rawX / maxX) * 10);
      const finalY = Math.round((rawY / maxY) * 10);

      const ideology = getScientificIdeology(finalX, finalY);

      document.getElementById('quiz-ui').style.display = 'none';
      document.getElementById('results-ui').style.display = 'block';
      document.getElementById('ideology-title').innerText = ideology;
      document.getElementById('coordinates-text').innerText = `Координаты: X = ${finalX} (Экономика), Y = ${finalY} (Личность)`;
    }

    // Перезапуск теста
    function restartQuiz() {
      currentQuestionIndex = 0;
      userAnswers = [];
      document.getElementById('results-ui').style.display = 'none';
      document.getElementById('quiz-ui').style.display = 'block';
      renderQuestion();
    }

    // Старт теста
    renderQuestion();
  </script>
</body>
</html>
